}
function mkG(a,b,seg,n,lo,hi,stage){const s=[];for(let i=0;i<n;i++){const ta=(i+rnd()*.8)/n;s.push({ta,tb:Math.max(0,Math.min(1,ta+(rnd()-.5)*.5)),thr:Math.min(D.w*k,W)*(lo+rnd()*(hi-lo)),br:false,sd:rnd()*2-1,s:0})}return{a,b,seg,st:s,stage,dead:false,rev:false,t:0}}
function gp(g,p,t){const s=g.seg;const q=[p.x+(s[0]+(s[2]-s[0])*t-p.ox)*k,p.y+(s[1]+(s[3]-s[1])*t-p.oy)*k];const d=p.d;if(!d)return q;const dx=q[0]-d.ox,dy=q[1]-d.oy,c=Math.cos(d.a),sn=Math.sin(d.a),u=(dx*c+dy*sn)*d.su,v=(-dx*sn+dy*c)*d.sv;return[d.ox+u*c-v*sn,d.oy+u*sn+v*c]}
function emit(x,y,n,pw,r){for(let i=0;i<n&&parts.length<700;i++){const a=rnd()*6.283,v=pw*(.2+rnd());parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-pw*.2,r:(1+rnd()*2.5)*r,l:.3+rnd()*1.3})}}
function splat(x,y,r){x=Math.max(-W,Math.min(2*W,x))+W;y=Math.max(0,Math.min(H,y));
 bctx.fillStyle=`rgba(${95+rnd()*70|0},0,0,${.6+rnd()*.4})`;bctx.beginPath();bctx.ellipse(x,y,r*(1+rnd()),r*(1+rnd()*.7),rnd()*3,0,7);bctx.fill();
 for(let i=0;i<3;i++){bctx.beginPath();bctx.arc(x+(rnd()-.5)*r*5,y+(rnd()-.5)*r*5,r*rnd()*.5+.5,0,7);bctx.fill()}

function hit(x,y){for(let i=P.length-1;i>=0;i--){const p=P[i];if(!p.alive||p.h_!=null)continue;
 if(p.name.length==1){const b=D.belly[p.name];if(Math.hypot((x-p.x)/k+p.ox-b[0],(y-p.y)/k+p.oy-b[1])>105)continue}
 for(const[dx,dy]of(p.name.length==1?[[0,0]]:[[0,0],[12,0],[-12,0],[0,12],[0,-12]])){const lx=Math.round((x+dx-p.x)/k),ly=Math.round((y+dy-p.y)/k);
  if(lx>=0&&ly>=0&&lx<p.w&&ly<p.h&&p.hc.getImageData(lx,ly,1,1).data[3]>40)return p}}return null}
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left+cam,y:e.clientY-r.top}}

addEventListener('resize',()=>{if(ready)reset()});
function drawOrgan(o){const u=Math.max(10,26*k);ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.r);ctx.lineWidth=Math.max(1.5,u*.1);ctx.strokeStyle='#3a0508';ctx.lineJoin='round';ctx.lineCap='round';
 if(o.t=='heart'){ctx.fillStyle='#c4203f';ctx.beginPath();ctx.moveTo(0,u*.7);ctx.bezierCurveTo(-u*1.1,u*.05,-u*.7,-u*.8,0,-u*.3);ctx.bezierCurveTo(u*.7,-u*.8,u*1.1,u*.05,0,u*.7);ctx.fill();ctx.stroke()}
 else if(o.t=='lung'){ctx.fillStyle='#e58a98';ctx.beginPath();ctx.ellipse(0,0,u*.5,u*.85,0,0,7);ctx.fill();ctx.stroke()}

 else if(o.t=='chunk'){ctx.fillStyle='#8c1c1c';ctx.beginPath();ctx.ellipse(0,0,u*.38,u*.26,0,0,7);ctx.fill();ctx.stroke()}
 else if(o.t=='fur'){ctx.fillStyle='#3c7d1f';ctx.beginPath();ctx.ellipse(0,0,u*.3,u*.17,0,0,7);ctx.fill()}
 else if(o.t=='bone'){ctx.strokeStyle='#eee6d8';ctx.lineWidth=u*.22;ctx.beginPath();ctx.moveTo(-u*.5,0);ctx.lineTo(u*.5,0);ctx.stroke()}
 else if(o.t=='stomach'){ctx.fillStyle='#d9737c';ctx.beginPath();ctx.ellipse(0,0,u*.8,u*.5,.5,0,7);ctx.fill();ctx.stroke()}
 else{ctx.strokeStyle='#3a0508';ctx.lineWidth=u*.55;ctx.beginPath();for(let i=0;i<=8;i++){const x=(i-4)*u*.35,y=Math.sin(i*1.5)*u*.4;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();ctx.strokeStyle='#e9a0a8';ctx.lineWidth=u*.4;ctx.stroke()}
 ctx.restore()}
function explode(m,x,y){if(m.ex)return;m.ex=true;m.dead=true;shake=.7;msgT=2;for(const p of[m.L,m.R]){p.alive=false;p.h_=null}for(const g of G)if(g.a.m===m)g.dead=true;
 const s=Math.max(.6,k);emit(x,y,200,1100*s,k*3.4);emit(x,y,100,500*s,k*2.6);
 const T=['heart','lung','lung','liver','stomach','gut','gut','gut','heart','chunk','chunk','chunk','chunk','chunk','chunk','chunk','fur','fur','fur','fur','bone','bone','bone'];
 for(const t of T){const a=-Math.PI/2+(rnd()-.5)*2.8,v=(200+rnd()*700)*s;organs.push({t,x:x+(rnd()-.5)*40*k,y:y-10,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:rnd()*6,vr:(rnd()-.5)*14})}
 for(let i=0;i<8;i++)splat(x+(rnd()-.5)*300*k,FY+rnd()*(H-FY)*.6,k*(4+rnd()*8))}
function mkIcon(){const c=document.createElement('canvas');c.width=100;c.height=72;const x=c.getContext('2d');const sc=72/D.h;const ox=50-sc*0,oy=(72-D.h*sc)/2;for(const n of['L','R']){const d=D.p[n];x.drawImage(d.img,ox+d.ox*sc,oy+d.oy*sc,d.w*sc,d.h*sc)}const u=c.toDataURL();document.getElementById('ic').src=u;document.getElementById('ghost').src=u}
function addMonkey(add,wx,wy){const m={dead:false};const dx=wx!=null?wx-X0g:add?cam+(rnd()-.5)*W*.3:0,dy=wx!=null?wy-(Y0g+D.h*k/2):FY-(Y0g+D.h*k);for(const n of['L','R']){const d=D.p[n];const p={name:n,m,img:d.img,hc:d.hc,ox:d.ox,oy:d.oy,w:d.w,h:d.h,x:X0g+d.ox*k+dx,y:Y0g+d.oy*k+dy,alive:true,h_:null,gx:0,gy:0};m[n]=p;P.push(p)}G.push(mkG(m.L,m.R,[0,0,0,D.h],14,.07,.29,1))}
function death(m){m.dead=true;msgT=3;shake=.5;
 const L=m.L,R=m.R;
 for(const h of[]){h.alive=false;for(const n of['h','t','a','f']){const s=PM[h.name+n];s.alive=true;s.x=h.x+(s.ox-h.ox)*k;s.y=h.y+(s.oy-h.oy)*k}
  if(h.h_!=null){const t=PM[h.name+'t'];t.h_=h.h_;const q=ptrs.get(t.h_);t.gx=q.x-t.x;t.gy=q.y-t.y;h.h_=null}}
 for(const c of [])G.push(mkG(PM[c.a],PM[c.b],c.seg,6,.03,.09,2));
 const mx=(L.x+L.w*k+R.x)/2,my=L.y+L.h*k/2;emit(mx,my,160,1000*Math.max(.5,k),k*3.2);emit(mx,my,80,500*Math.max(.5,k),k*2.5);
 for(let i=0;i<9;i++){const a=-Math.PI/2+(rnd()-.5)*2.4,v=(250+rnd()*500)*Math.max(.6,k);organs.push({t:['heart','lung','lung','liver','stomach','gut','gut','gut','heart'][i],x:mx,y:my,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:rnd()*6,vr:(rnd()-.5)*10})}

}
function step(dt){
 for(const p of P){p.ts=(p.ts||0)+((p.tt||0)-(p.ts||0))*.25;if(p.ts>.01){const hd=p.h_!=null;p.d={ox:p.og?p.og[0]:p.x,oy:p.og?p.og[1]:p.y,a:p.aa||0,su:1,sv:1}}else p.d=null}
 for(const p of P)if(p.alive&&p.h_!=null){const q=ptrs.get(p.h_);if(q){const nx=q.x-p.gx,ny=q.y-p.gy;p.vx=(nx-p.x)/Math.max(dt,.008)*.4+(p.vx||0)*.6;p.vy=(ny-p.y)/Math.max(dt,.008)*.4+(p.vy||0)*.6;p.x=nx;p.y=ny}else p.h_=null}
 for(const p of P){if(!p.alive||p.h_!=null)continue;p.vy=(p.vy||0)+1800*dt;p.vx=(p.vx||0)*.995;p.x+=p.vx*dt;p.y+=p.vy*dt;const b=FY-p.h*k;if(p.y>b){p.y=b;if(p.vy>950&&!p.m.ex){explode(p.m,p.x+p.w*k/2,FY);continue}p.vy=Math.abs(p.vy)>250?-p.vy*.25:0;p.vx*=.8}}
 for(const g of G){if(g.dead||!g.a.alive||!g.b.alive)continue;
  const ah=g.a.h_!=null,bh=g.b.h_!=null;
  if(ah!=bh){const f=ah?g.b:g.a,h=ah?g.a:g.b,m1=gp(g,f,.5),m2=gp(g,h,.5);const ff=g.stage==1?.4:.025;f.vx=0;f.vy=0;f.x+=(m2[0]-m1[0])*ff;f.y+=(m2[1]-m1[1])*ff}else if(!ah&&!bh&&g.stage==1){const m1=gp(g,g.a,.5),m2=gp(g,g.b,.5);g.a.x+=(m2[0]-m1[0])*.15;g.a.y+=(m2[1]-m1[1])*.15;g.b.x-=(m2[0]-m1[0])*.15;g.b.y-=(m2[1]-m1[1])*.15}
  let mt=0,alive=0,mxs=0;
  for(const s of g.st){if(s.br)continue;const A=gp(g,g.a,s.ta),B=gp(g,g.b,s.tb);const dd0=Math.hypot(A[0]-B[0],A[1]-B[1]);if(s.r0==null)s.r0=dd0;s.s=Math.max(0,dd0-s.r0);
   if(s.s>s.thr&&(g.stage!=1||(g.a.h_!=null&&g.b.h_!=null))){s.br=true;g.rev=true;emit((A[0]+B[0])/2,(A[1]+B[1])/2,10,260*Math.max(.5,k),k*1.6)}else{alive++;mt=Math.max(mt,s.s/s.thr);mxs=Math.max(mxs,s.s)}}
  if(mxs>4)g.rev=true;g.t=mt;
  if(!alive){g.dead=true;g.t=0;if(g.stage==1&&!g.a.m.dead)death(g.a.m)}}
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vy+=1500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;
  if(p.l<=0||p.x<-W||p.x>2*W||p.y<0||p.y>=FY){const fl=p.y>=FY;splat(p.x,fl?FY+rnd()*(H-FY)*.6:p.y,p.r);if(fl&&p.r>4)emit(p.x,FY,3,160,1);parts.splice(i,1)}}
 for(const p of P)p.tt=0;
 for(const g of G){if(g.dead||g.t<=0)continue;for(const[p,o]of[[g.a,g.b],[g.b,g.a]]){const tv=Math.min(1,g.t*1.4);if(tv>(p.tt||0)){p.tt=tv;const m1=gp(g,p,.5),m2=gp(g,o,.5);p.aa=Math.atan2(m2[1]-m1[1],m2[0]-m1[0]);const sg=g.seg;p.og=[p.x+((sg[0]+sg[2])/2-p.ox)*k,p.y+((sg[1]+sg[3])/2-p.oy)*k]}}}
 for(const L of P){if(L.name!='L')continue;const R=L.m.R,dd=(L.x-L.ox*k)-(R.x-R.ox*k);if(dd>0){const lh=L.h_!=null,rh=R.h_!=null;if(lh&&!rh)L.x-=dd;else if(rh&&!lh)R.x+=dd;else{L.x-=dd/2;R.x+=dd/2}}}
 for(const o of organs){o.vy+=1500*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;o.r+=o.vr*dt;const u=Math.max(10,26*k);if(o.y>FY-u*.5){o.y=FY-u*.5;if(Math.abs(o.vy)>160){splat(o.x,FY+rnd()*(H-FY)*.5,u*.25);emit(o.x,FY,4,200,k*1.2)}o.vy*=-.3;o.vx*=.7;o.vr*=.6;if(Math.abs(o.vy)<30)o.vy=0}if(o.x<-W+u){o.x=-W+u;o.vx*=-.4}if(o.x>2*W-u){o.x=2*W-u;o.vx*=-.4}}
 msgT=Math.max(0,msgT-dt);shake=Math.max(0,shake-dt);
}
function draw(){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.drawImage(bg,-(cam+W),0,3*W,H);ctx.drawImage(blood,-(cam+W),0,3*W,H);
 ctx.translate(-cam,0);if(shake>0)ctx.translate((rnd()-.5)*shake*30,(rnd()-.5)*shake*30);
 for(const p of P){if(!p.alive)continue;
  let t=0,ax=0,ay=0;

  if(p.m.dead&&D.eye[p.name]){const e=D.eye[p.name],ex=(e[0]-p.ox)*k-w/2,ey=(e[1]-p.oy)*k-h/2,s=9*k;ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(2,3*k);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(ex-s,ey-s);ctx.lineTo(ex+s,ey+s);ctx.moveTo(ex+s,ey-s);ctx.lineTo(ex-s,ey+s);ctx.stroke()}

 for(const g of G){if(!g.rev||!g.a.alive||!g.b.alive)continue;
  ctx.strokeStyle='#3d0000';ctx.lineWidth=Math.max(3,13*k);
  for(const p of[g.a,g.b]){const A=gp(g,p,0),B=gp(g,p,1);ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke()}
  for(const s of g.st){const A=gp(g,g.a,s.ta),B=gp(g,g.b,s.tb),dx=B[0]-A[0],dy=B[1]-A[1],d=Math.hypot(dx,dy)||1;
   if(!s.br){const r=s.s/s.thr;ctx.strokeStyle=`rgb(${70+130*r|0},${10*r|0},${10*r|0})`;ctx.lineWidth=Math.max(1.6,6.5*k*(1-.6*r));
    const sg=s.sd*(1-r)*.35*d,mx=(A[0]+B[0])/2-dy/d*sg,my=(A[1]+B[1])/2+dx/d*sg;ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.quadraticCurveTo(mx,my,B[0],B[1]);ctx.stroke()}
   else{ctx.strokeStyle='#4a0000';ctx.lineWidth=Math.max(2,6*k);const L=Math.min(d,(10+8*(s.sd+1))*k);
    for(const[P0,sgn]of[[A,1],[B,-1]]){const ex=P0[0]+sgn*dx/d*L,ey=P0[1]+sgn*dy/d*L;ctx.beginPath();ctx.moveTo(P0[0],P0[1]);ctx.lineTo(ex,ey);ctx.stroke();
     if(parts.length<500&&rnd()<.012)parts.push({x:ex,y:ey,vx:(rnd()-.5)*30,vy:0,r:(1+rnd())*k*1.3,l:.5+rnd()*.6})}}}}
 for(const o of organs)drawOrgan(o);ctx.fillStyle='#b01010';for(const p of parts){ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1.5,p.r),0,7);ctx.fill()}
 ctx.fillStyle='rgba(255,255,255,.25)';for(const[,q]of ptrs){ctx.beginPath();ctx.arc(q.x,q.y,16,0,7);ctx.fill()}
 if(msgT>0){ctx.globalAlpha=Math.min(1,msgT);ctx.fillStyle='#d11';ctx.font='bold '+Math.min(54,W*.12)+'px system-ui';ctx.textAlign='center';ctx.fillText('¡MURIÓ!',W/2,H*.2);ctx.globalAlpha=1}
}
function loop(t){const dt=Math.min(.033,(t-last)/1000||.016);last=t;step(dt);draw();requestAnimationFrame(loop)}
